name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8"

      - name: Collect Android artifacts
        run: |
          mkdir -p dist
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/YuMusic-${VERSION}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*

  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -workspace ios/YuMusic.xcworkspace \
            -scheme YuMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/YuMusic.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          mkdir -p dist Payload
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          cp -R "build/YuMusic.xcarchive/Products/Applications/YuMusic.app" Payload/
          zip -qry "dist/YuMusic-${VERSION}-ios.ipa" Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*

  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME:-v1.9.3}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)
          {
            echo "## 📋 更新日志"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD"
              echo ""
            else
              git log --no-merges -n 10 --pretty=format:"- %s (%h)"
              echo ""
            fi
            echo ""
            echo "## 📦 安装说明"
            echo ""
            echo "- **Android**：直接下载安装 \`YuMusic-*-android.apk\`"
            echo "- **iOS (IPA)**：\`YuMusic-*-ios.ipa\` 为未签名 IPA 包，支持使用 AltStore / SideStore / TrollStore / Sideloadly / 巨魔 / 证书自签 安装！"
          } > RELEASE_CHANGELOG.md
          cat RELEASE_CHANGELOG.md

      - name: Update or Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.9.3' }}
          name: YuMusic ${{ github.ref_type == 'tag' && github.ref_name || 'v1.9.3' }}
          body_path: RELEASE_CHANGELOG.md
          files: dist/*
          fail_on_unmatched_files: false

